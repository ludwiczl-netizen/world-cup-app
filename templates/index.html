<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<title>Ranking MŚ 2026</title>
</head>

<body class="p-3">

<h2 class="mb-3">🏆 Ranking MŚ 2026</h2>

<table class="table table-striped">

<thead>
<tr>
<th>#</th>
<th>Gracz</th>
<th>Punkty</th>
</tr>
</thead>

<tbody>

{% for row in ranking %}
<tr>
<td>{{ loop.index }}</td>
<td>{{ row.gracz }}</td>
<td><b>{{ row.punkty }}</b></td>
</tr>
{% endfor %}

</tbody>

</table>

</body>
</html>
